services:
  mysql:
    image: mysql:8.0
    container_name: dlytime-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dlytime
      MYSQL_USER: dlytime
      MYSQL_PASSWORD: dlytime
    ports:
      - "3307:3306"
    volumes:
      - dlytime_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dlytime_data:
